# Responsive QA matrix on real engines (Chromium, WebKit, Firefox) against a production build served
# inside the runner — no load on the live Vercel site. Results: job annotations, step summary, and the
# screenshots + contact sheet as an artifact.
name: Responsive QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "content/**"
      - "lib/**"
      - "public/**"
      - "scripts/qa/**"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/responsive-qa.yml"

concurrency:
  group: responsive-qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  matrix:
    name: ${{ matrix.engine }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: npm run build
      - name: Start production server
        run: |
          npx next start -p 3000 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/ >/dev/null && break; sleep 1; done
      - name: Responsive matrix
        run: node scripts/qa/responsive.mjs http://localhost:3000/ --engines=${{ matrix.engine }}
        continue-on-error: true
      - name: Publish results
        if: always()
        run: node scripts/qa/annotate.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-${{ matrix.engine }}
          path: scripts/qa/out/responsive
          retention-days: 14
